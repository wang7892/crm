logger.sql.level=info
management.endpoints.enabled-by-default=false
springdoc.api-docs.groups.enabled=true
spring.freemarker.check-template-location=false
spring.groovy.template.check-template-location=false

# 默认 all in one 配置，单机环境使用
mysql.embedded.enabled=true
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cordys-crm?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=%27STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION%27
spring.datasource.username=root
spring.datasource.password=CordysCRM@mysql
spring.flyway.enabled=true

# Task attachments are stored on the backend server filesystem.
crm.task.attachment.root=/opt/cordys/data/task-attachments
crm.task.attachment.max-file-size=50MB
crm.task.attachment.max-files=10
spring.session.timeout=30d

redis.embedded.enabled=true
spring.data.redis.host=127.0.0.1
spring.data.redis.password=CordysCRM@redis
spring.data.redis.port=6379
spring.session.redis.repository-type=indexed

# MCP Server 配置
mcp.embedded.enabled=true
cordys.crm.url=http://127.0.0.1:8081
spring.mvc.async.request-timeout=60000
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.name=cordys-crm-mcp-server
spring.ai.mcp.server.version=1.0.0

# SQLBot 默认获取 spring.datasource 配置访问数据库，支持自定义配置只读用户
# sqlbot.datasource.username=Read-only-user
# sqlbot.datasource.password=CordysCRM@mysql

# 支持加密 API /db/structure 返回的敏感数据，默认 false
# sqlbot.encrypt=false
# sqlbot.aes-key=your-aes-key
# sqlbot.aes-iv=your-aes-iv

# 启用白名单功能,不开启则不限制访问
dashboard.whitelist.enabled=false
# 白名单开关开启后允许访问的IP地址或域名列表,多个用逗号分隔
dashboard.whitelist.allowed=

# MLS external CRM synchronization. Keep credentials only in the production
# /data/CORDYSCRM/conf/cordys-crm.properties file, never in this template.
quartz.time-zone=Asia/Shanghai
crm.mls-sync.enabled=false
crm.mls-sync.organization-id=
crm.mls-sync.page-size=2000
# Daily synchronization time in Asia/Shanghai, using strict HH:mm format.
crm.mls-sync.time=00:00
# crm.ai-agent.external-order.enabled=true
# organization-id is only used by the optional external-to-CRM synchronization;
# AI Agent read-only queries use the configured data source without an extra binding gate.
# crm.ai-agent.external-order.organization-id=<CRM_ORGANIZATION_ID>
# Public MySQL must use TLS identity verification, or be reached through an
# approved VPN/private line. MLS_DB_TLS_HOST must match the certificate SAN.
# crm.ai-agent.external-order.url=jdbc:mysql://<MLS_DB_TLS_HOST>:3306/mls_agent_data?useUnicode=true&characterEncoding=UTF-8&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/data/CORDYSCRM/conf/mls-agent-data-ca.p12&trustCertificateKeyStorePassword=<truststore-password>&trustCertificateKeyStoreType=PKCS12
# crm.ai-agent.external-order.username=<read-only-user>
# crm.ai-agent.external-order.password=<read-only-password>
# crm.ai-agent.external-order.connection-timeout=30000
# crm.ai-agent.external-order.socket-timeout=120000
# crm.ai-agent.external-order.query-timeout-seconds=120

# Auxiliary company-knowledge RAG injects matched document content into the
# question parser and falls back to the original answer flow on retrieval errors.
crm.ai-agent.rag.semantic.enabled=true
crm.ai-agent.rag.semantic.shadow-enabled=false
crm.ai-agent.rag.semantic.max-rules=3
crm.ai-agent.rag.semantic.max-context-chars=4000

# Semantic-rule extraction requires an OpenAI-compatible chat-completions
# provider. Keep the real API key only in the production configuration file.
# crm.ai-agent.llm.enabled=true
# crm.ai-agent.llm.base-url=https://<llm-host>
# crm.ai-agent.llm.api-key=<secret>
# crm.ai-agent.llm.model=<model-name>

crm.ai-agent.knowledge.parse.max-retries=3
crm.ai-agent.knowledge.parse.stale-timeout-ms=600000
crm.ai-agent.knowledge.parse.recovery-batch-size=20
crm.ai-agent.knowledge.parse.core-pool-size=2
crm.ai-agent.knowledge.parse.max-pool-size=4
crm.ai-agent.knowledge.parse.queue-capacity=100
