# ==============================
# 数据库连接配置
# ==============================
# 数据库连接 URL，请根据实际环境修改 IP 与数据库名称
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cordys-crm?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false

# 数据库用户名
spring.datasource.username=root

# 数据库密码
spring.datasource.password=123456

# ==============================
# Redis 缓存配置
# ==============================
# Redis 服务器地址
spring.data.redis.host=127.0.0.1

# Redis 端口
spring.data.redis.port=6379

# Redis 密码
#spring.data.redis.password=CordysCRM@redis

# Redis Session 存储方式（indexed 推荐）
spring.session.redis.repository-type=indexed

# Session 过期时间（单位：秒，示例为 12 小时）
spring.session.timeout=43200s

# Webhook稳定期：先只落库，不自动创建跟进
crm.webhook.create-follow=true

# 企微缓冲自动写跟进（每 60 秒消费待同步消息，包含当天消息）
crm.wecom.auto-create-follow=true
crm.wecom.auto-follow-poll-ms=60000
crm.wecom.auto-follow-current-day=true

# 自研 AI Agent 外部订单/合同只读数据源
# 开启后用于查询 47.110.46.27:3306/mls_agent_data.contract_info。
# 请使用只读账号，不要把生产写账号放在这里。
crm.ai-agent.external-order.enabled=true
crm.ai-agent.external-order.url=jdbc:mysql://47.110.46.27:3306/mls_agent_data?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false
crm.ai-agent.external-order.username=mls04
crm.ai-agent.external-order.password=12345@Mls

# AI Agent 大模型解析配置，默认关闭；开启后请配置 OpenAI-compatible chat completions 地址。
crm.ai-agent.llm.enabled=true
crm.ai-agent.llm.base-url=https://www.fucheers.top/v1
crm.ai-agent.llm.api-key=sk-Q8ExWUiV48EGogUfSLN1dbgze5kRH5ozXNFY0hPDWI8YZ8cF
crm.ai-agent.llm.model=gpt-5.5
crm.ai-agent.llm.timeout-seconds=10
crm.ai-agent.llm.min-confidence=0.75
crm.ai-agent.llm.max-input-length=1000
crm.ai-agent.llm.max-retry=1
crm.ai-agent.llm.providers[0].name=qwen
crm.ai-agent.llm.providers[0].enabled=true
crm.ai-agent.llm.providers[0].base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
crm.ai-agent.llm.providers[0].api-key=sk-0486d670e3554f578e349796d0fb6f95
crm.ai-agent.llm.providers[0].api-key-required=true
crm.ai-agent.llm.providers[0].model=qwen3.7-max
crm.ai-agent.llm.providers[0].timeout-seconds=60
crm.ai-agent.llm.providers[0].max-retry=1
crm.ai-agent.llm.providers[1].name=deepseek
crm.ai-agent.llm.providers[1].enabled=true
crm.ai-agent.llm.providers[1].base-url=https://api.deepseek.com
crm.ai-agent.llm.providers[1].chat-completions-path=/chat/completions
