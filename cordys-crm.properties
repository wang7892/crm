crm.ai-agent.llm.providers[1].model=deepseek-v4-pro
crm.ai-agent.llm.providers[1].timeout-seconds=10
crm.ai-agent.llm.providers[1].max-retry=1

# AI Agent 受控只读 SQL 配置，默认关闭；开启前必须完成权限注入和审计策略。
crm.ai-agent.sql.enabled=true
crm.ai-agent.sql.max-rows=100
crm.ai-agent.sql.allowed-tables=customer,sys_user,sys_organization_user,customer_collaboration,contract,follow_up_record,wecom_ingestion_session_day,wecom_ingestion_message,wecom_ingestion_media,wecom_ingestion_message_follow_record,email_webhook_event,email_webhook_attachment,contract_info,mls_agent_data.contract_info
crm.ai-agent.sql.audit-enabled=true

# AI Agent 聊天/邮件正文查看配置，默认关闭；开启后必须按角色、数据范围和审计控制。
crm.ai-agent.message-body.enabled=false
crm.ai-agent.message-body.allowed-roles=admin,boss,sales_manager
crm.ai-agent.message-body.max-rows=20
crm.ai-agent.message-body.mask-sensitive=true
crm.ai-agent.message-body.audit-enabled=true

# Windows local runtime paths
logging.file.path=E:/CordysCRM-1.6.0/runtime/logs/cordys-crm
spring.servlet.multipart.location=E:/CordysCRM-1.6.0/runtime/tmp/upload
